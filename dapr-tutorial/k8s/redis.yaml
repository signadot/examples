# Redis is the message broker behind the Dapr pub/sub component (Redis Streams).
# Dapr does not ship a broker on Kubernetes; this is the one its quickstarts use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: dapr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dapr-demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
