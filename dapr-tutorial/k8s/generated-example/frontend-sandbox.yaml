name: dapr-demo-frontend
spec:
  cluster: minikube
  defaultRouteGroup:
    endpoints:
    - name: console
      target: http://frontend.dapr-demo.svc:8080
  description: Dapr tutorial fork with native mTLS and unique app identity
  forks:
  - customizations:
      patch:
        type: strategic
        value: '{"spec": {"template": {"metadata": {"annotations": {"dapr.io/app-id":
          "sbx-dapr-demo-frontend-frontend-03fea3bd"}}, "spec": {"containers": [{"name":
          "app", "image": "dapr-signadot-tutorial:local", "env": [{"name": "CONSOLE_VARIANT",
          "value": "sandbox"}]}]}}}}'
    forkOf:
      kind: Deployment
      name: frontend
      namespace: dapr-demo
  labels:
    tutorial.signadot.com/owner: d28972fc-d669-4804-bf82-0bab39ef538c
