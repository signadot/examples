apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  labels:
    tutorial.signadot.com/owner: d28972fc-d669-4804-bf82-0bab39ef538c
  name: pubsub
  namespace: dapr-demo
spec:
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    value: ''
  - name: consumerID
    value: '{appID}'
  - name: processingTimeout
    value: 10s
  - name: redeliverInterval
    value: 1s
  type: pubsub.redis
  version: v1
---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  labels:
    tutorial.signadot.com/owner: d28972fc-d669-4804-bf82-0bab39ef538c
  name: pubsub-retries
  namespace: dapr-demo
spec:
  policies:
    retries:
      inbound:
        duration: 1s
        maxRetries: 3
        policy: constant
  targets:
    components:
      pubsub:
        inbound:
          retry: inbound
