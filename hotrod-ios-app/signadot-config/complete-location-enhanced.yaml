name: complete-location-enhanced
spec:
  description: "Complete sandbox with frontend and enhanced location service"
  cluster: "local-hotrod-cluster"
  labels:
    feature: enhanced-locations
    team: backend
  forks:
    # Fork the frontend service to route to sandbox location service
    - forkOf:
        kind: Deployment
        namespace: hotrod
        name: frontend
      customizations:
        images:
          - image: mostafamraafat/hotrod-frontend:env-routing-v1
            container: hotrod
        env:
          - container: hotrod
            name: LOCATION_SERVICE_URL
            value: "complete-location-enhanced-dep-location:8081"
    # Fork the location service with enhanced database
    - forkOf:
        kind: Deployment
        namespace: hotrod
        name: location
      customizations:
        images:
          - image: mostafamraafat/hotrod-location:dynamic-seed-v5
            container: hotrod
        env:
          - container: hotrod
            name: MYSQL_DATABASE
            value: "hotrod_sandbox"
