apiVersion: v1
kind: ServiceAccount
metadata:
  name: producer
  namespace: redis-streams-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: redis-streams-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
      annotations:
        sidecar.signadot.com/inject: "true"
    spec:
      serviceAccountName: producer
      containers:
        - name: producer
          image: redis-streams-demo-python:latest
          imagePullPolicy: IfNotPresent
          args: ["producer"]
          env:
            - name: SIGNADOT_BASELINE_NAME
              value: producer
            - name: SIGNADOT_BASELINE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  namespace: redis-streams-demo
  labels:
    app: producer
spec:
  type: ClusterIP
  selector:
    app: producer
  ports:
    - port: 4000
      name: http
