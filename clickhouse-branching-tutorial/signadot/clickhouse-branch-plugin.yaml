name: clickhouse-branch
spec:
  description: Branches a ClickHouse database for each sandbox by hard-linking its partitions
  runner:
    image: curlimages/curl:8.23.0
    namespace: clickhouse-demo
    podTemplateOverlay: |
      spec:
        containers:
          - name: main
            securityContext:
              runAsUser: 0  # Signadot writes each step's script into a root-owned volume
            envFrom:
              - secretRef:
                  name: clickhouse
  create:
    - name: createbranch
      inputs:
        - name: database
          valueFromSandbox: true
          as:
            env: SOURCE
        - name: partitions
          valueFromSandbox: true
          as:
            env: PARTITIONS
      script: |
        #!/bin/sh
        set -euo pipefail
        ch() { curl -sS --fail-with-body -u "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" "$CLICKHOUSE_URL" --data-binary "$1"; }

        BRANCH="${SOURCE}_$(echo "$SIGNADOT_SANDBOX_NAME" | tr - _)"
        LIMIT="LIMIT $PARTITIONS"; [ "$PARTITIONS" = all ] && LIMIT=""
        # If anything below fails, drop the partial branch.
        trap 'ch "DROP DATABASE IF EXISTS $BRANCH SYNC" || true' EXIT

        # 1. A fresh database for the branch, on the same server as the source.
        ch "DROP DATABASE IF EXISTS $BRANCH SYNC"
        ch "CREATE DATABASE $BRANCH"

        # 2. Each MergeTree table: copy the schema, then attach the newest partitions.
        #    ATTACH PARTITION ... FROM hard-links the source's parts, so no data is copied.
        TABLES=$(ch "SELECT name FROM system.tables WHERE database = '$SOURCE' AND engine LIKE '%MergeTree'")
        for t in $TABLES; do
          ch "CREATE TABLE $BRANCH.$t AS $SOURCE.$t"
          PARTS=$(ch "SELECT DISTINCT partition_id FROM system.parts
                      WHERE database = '$SOURCE' AND table = '$t' AND active ORDER BY partition_id DESC $LIMIT")
          for p in $PARTS; do
            ch "ALTER TABLE $BRANCH.$t ATTACH PARTITION ID '$p' FROM $SOURCE.$t"
          done
          echo "$t: attached $(echo $PARTS | wc -w) partition(s)"
        done

        # 3. Materialized views, rewritten to read and write the branch's tables.
        ch "SELECT create_table_query FROM system.tables
            WHERE database = '$SOURCE' AND engine = 'MaterializedView' FORMAT TSVRaw" |
          sed "s/ $SOURCE\./ $BRANCH./g" |
          while IFS= read -r ddl; do ch "$ddl"; done

        mkdir -p /outputs && echo -n "$BRANCH" > /outputs/database
        trap - EXIT
      outputs:
        - name: database
          valueFromPath: /outputs/database
  delete:
    - name: deletebranch
      inputs:
        - name: database
          valueFromStep:
            name: createbranch
            output: database
          as:
            env: BRANCH
      script: |
        #!/bin/sh
        set -eu
        # Dropping the branch removes only its hard links; the source keeps its parts.
        curl -sS --fail-with-body -u "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" "$CLICKHOUSE_URL" \
          --data-binary "DROP DATABASE IF EXISTS $BRANCH SYNC"
