apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: sidekiq-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
      annotations:
        # Lets Signadot route requests that carry a routing key to a sandbox.
        sidecar.signadot.com/inject: "true"
    spec:
      containers:
        - name: notifier
          image: sidekiq-demo:latest
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "puma", "-p", "4001", "config/notifier.ru"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379
          ports:
            - containerPort: 4001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4001
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
  namespace: sidekiq-demo
spec:
  selector:
    app: notifier
  ports:
    - port: 4001
      name: http
