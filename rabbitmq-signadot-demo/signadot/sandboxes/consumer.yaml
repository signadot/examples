name: consumer-v2
spec:
  labels:
    demo: rabbitmq
    signadot.com/sandbox: consumer-v2
  cluster: "@{cluster}"
  forks:
  - forkOf:
      kind: Deployment
      namespace: rabbitmq-demo
      name: consumer
    # A fork copies the baseline's env, including QUEUE_NAME=consumer-baseline.
    # Give the fork its own temporary queue so it doesn't compete with the baseline.
    customizations:
      env:
      - name: QUEUE_NAME
        value: consumer-v2
      - name: QUEUE_DURABLE
        value: "false"
      - name: QUEUE_AUTO_DELETE
        value: "true"
  defaultRouteGroup:
    endpoints:
    - name: publisher
      target: http://publisher.rabbitmq-demo.svc:8080
