apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: debezium-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: debezium-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
      annotations:
        sidecar.signadot.com/inject: "true"
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: debezium-cdc-demo:latest
          imagePullPolicy: IfNotPresent
          args: ["orders"]
          env:
            - name: SIGNADOT_BASELINE_NAME
              value: orders
            - name: SIGNADOT_BASELINE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: debezium-demo
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - port: 4000
      name: http
