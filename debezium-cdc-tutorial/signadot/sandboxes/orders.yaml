name: debezium-orders
spec:
  description: "orders sandbox for the Debezium CDC demo"
  cluster: "@{cluster}"
  labels:
    demo: debezium-cdc
  forks:
    - forkOf:
        kind: Deployment
        namespace: debezium-demo
        name: orders
  defaultRouteGroup:
    endpoints:
      - name: orders
        target: http://orders.debezium-demo.svc:4000
