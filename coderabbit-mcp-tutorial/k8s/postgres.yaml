apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: boxoffice }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: boxoffice }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            # Demo-only credentials for this disposable database. Don't reuse them.
            - { name: POSTGRES_USER, value: boxoffice }
            - { name: POSTGRES_PASSWORD, value: boxoffice }
            - { name: POSTGRES_DB, value: boxoffice }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "boxoffice"] }
            initialDelaySeconds: 5
      volumes:
        - name: init
          configMap: { name: boxoffice-db-init }
