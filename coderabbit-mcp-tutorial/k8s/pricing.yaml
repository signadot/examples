apiVersion: v1
kind: Service
metadata: { name: pricing, namespace: boxoffice }
spec:
  selector: { app: pricing }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pricing, namespace: boxoffice }
spec:
  replicas: 1
  selector: { matchLabels: { app: pricing } }
  template:
    metadata:
      labels: { app: pricing }
      annotations:
        # Signadot's DevMesh sidecar. It carries the routing key that sends a
        # request to a sandbox's copy of a service instead of this one. Without
        # it a sandbox never becomes ready.
        sidecar.signadot.com/inject: "true"
    spec:
      containers:
        - name: pricing
          image: signadot/boxoffice-demo-pricing:baseline
          imagePullPolicy: IfNotPresent
          env:
            # Prefixes cached quotes. A forked pricing service needs its own value, since TTL alone cannot isolate them.
            - { name: CACHE_SECONDS, value: "60" }
            - { name: CACHE_NAMESPACE, value: "baseline-v2" }
          ports: [{ containerPort: 8082 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 3
