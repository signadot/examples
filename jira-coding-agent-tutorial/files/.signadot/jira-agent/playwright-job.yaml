spec:
  namePrefix: hotrod-playwright
  runnerGroup: hotrod-playwright
  script: |
    #!/bin/bash
    set -euo pipefail

    # Check out the pull request commit with the runner's read-only repository token.
    token=$(cat /var/run/hotrod-repo/token)
    git clone --quiet --depth 50 --branch "@{branch}" \
      "https://x-token-auth:${token}@bitbucket.org/@{repo}.git" hotrod
    unset token
    cd hotrod
    git checkout --quiet "@{commit}"

    # The routing context below sets SIGNADOT_ROUTING_KEY, which playwright.config.ts
    # sends with every request so the sandbox serves this pull request's services.
    export HOTROD_NAMESPACE=hotrod CI=true
    npm ci --silent

    set +e
    npx playwright test --reporter=list,html
    status=$?
    set -e
    tar czf playwright-report.tgz playwright-report test-results 2>/dev/null || true
    exit $status
  routingContext:
    sandbox: "@{sandbox}"
  uploadArtifact:
    - path: hotrod/playwright-report.tgz
