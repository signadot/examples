name: temporal-worker-go-sandbox
spec:
  labels:
    team: backend
  cluster: "@{cluster}"
  description: Testing temporal Go worker sandboxes
  defaultRouteGroup:
    endpoints:
    - name: web-client
      target: http://temporal-py-client-ui.temporal.svc:8080
  forks:
  - forkOf:
      kind: Deployment
      namespace: temporal
      name: temporal-worker-go
    customizations:
      images:
      - container: temporal-worker-go
        image: "@{image}"
