apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-reader
  namespace: signadot-tests
---
# Read-only access to Falco's pods and their logs, in the falco namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-log-reader
  namespace: falco
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-log-reader
  namespace: falco
subjects:
  - kind: ServiceAccount
    name: falco-reader
    namespace: signadot-tests
roleRef:
  kind: Role
  name: falco-log-reader
  apiGroup: rbac.authorization.k8s.io
