name: Create PR Sandbox
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  create-sandbox:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SERVICE: frontend # the service this repository builds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          make build-docker RELEASE_TAG=pr-${PR_NUMBER}
          docker tag signadot/hotrod:pr-${PR_NUMBER}-linux-amd64 <your-dockerhub-username>/hotrod:pr-${PR_NUMBER}
          docker push <your-dockerhub-username>/hotrod:pr-${PR_NUMBER}

      - name: Install Signadot CLI
        run: curl -sSLf https://raw.githubusercontent.com/signadot/cli/main/scripts/install.sh | sh

      - name: Apply Sandbox
        env:
          SIGNADOT_API_KEY: ${{ secrets.SIGNADOT_API_KEY }}
          SIGNADOT_ORG: ${{ secrets.SIGNADOT_ORG }}
        run: |
          # Keep the epic label if /epic already linked this pull request
          EPIC_ID=$(signadot sandbox get "${SERVICE}-pr-${PR_NUMBER}" -o json 2>/dev/null | jq -r '.spec.labels.epic // ""' || true)
          cat > sandbox.yaml << EOF
          name: "${SERVICE}-pr-${PR_NUMBER}"
          spec:
            cluster: "${{ secrets.SIGNADOT_CLUSTER }}"
            labels:
              signadot/github-pull-request: "${PR_NUMBER}"
              signadot/github-repo: "${{ github.repository }}"
              epic: "${EPIC_ID}"
            forks:
              - forkOf:
                  kind: Deployment
                  namespace: hotrod
                  name: ${SERVICE}
                customizations:
                  images:
                    - image: "<your-dockerhub-username>/hotrod:pr-${PR_NUMBER}"
          EOF
          signadot sandbox apply -f sandbox.yaml
