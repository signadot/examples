name: Link Epic Preview
on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  link-epic:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/epic ') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      SERVICE: frontend # the service this repository builds
      SIGNADOT_API_KEY: ${{ secrets.SIGNADOT_API_KEY }}
      SIGNADOT_ORG: ${{ secrets.SIGNADOT_ORG }}
    steps:
      - name: Parse Epic ID from comment
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          EPIC_ID=$(echo "$COMMENT" | awk '{print $2}')
          [[ "$EPIC_ID" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Invalid epic ID: $EPIC_ID"; exit 1; }
          echo "EPIC_ID=${EPIC_ID}" >> $GITHUB_ENV

      - name: Install Signadot CLI
        run: curl -sSLf https://raw.githubusercontent.com/signadot/cli/main/scripts/install.sh | sh

      - name: Update Sandbox with Epic Label
        run: |
          cat > sandbox.yaml << EOF
          name: "${SERVICE}-pr-${PR_NUMBER}"
          spec:
            cluster: "${{ secrets.SIGNADOT_CLUSTER }}"
            labels:
              signadot/github-pull-request: "${PR_NUMBER}"
              signadot/github-repo: "${{ github.repository }}"
              epic: "${EPIC_ID}"
            forks:
              - forkOf:
                  kind: Deployment
                  namespace: hotrod
                  name: ${SERVICE}
                customizations:
                  images:
                    - image: "<your-dockerhub-username>/hotrod:pr-${PR_NUMBER}"
          EOF
          signadot sandbox apply -f sandbox.yaml

      - name: Create or Update Epic RouteGroup
        id: routegroup
        run: |
          RG_NAME="$(echo "$EPIC_ID" | tr '[:upper:]' '[:lower:]')-preview"
          cat > routegroup.yaml << EOF
          name: "${RG_NAME}"
          spec:
            cluster: "${{ secrets.SIGNADOT_CLUSTER }}"
            match:
              label:
                key: epic
                value: "${EPIC_ID}"
            endpoints:
              - name: hotrod-frontend
                target: http://frontend.hotrod.svc:8080
            ttl:
              duration: 1d # counted from when the last matched sandbox is deleted
          EOF
          signadot routegroup apply -f routegroup.yaml
          PREVIEW_URL=$(signadot routegroup get "${RG_NAME}" -o json | jq -r '.endpoints[0].url')
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      - name: Post Preview URL back to PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Unified preview for **${{ env.EPIC_ID }}** is ready!
            Preview URL: **${{ steps.routegroup.outputs.preview_url }}**
