# A route group that joins every sandbox labeled with one epic. For example:
#   signadot routegroup apply -f .signadot/routegroup-template.yaml \
#     --set name=epic-42-preview --set cluster=my-cluster --set epic=EPIC-42
name: "@{name}"
spec:
  cluster: "@{cluster}"
  match:
    label:
      key: epic
      value: "@{epic}"
  endpoints:
    - name: hotrod-frontend
      target: http://frontend.hotrod.svc:8080
  ttl:
    duration: 1d # counted from when the last matched sandbox is deleted
